name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: bridge/requirements.txt
      - run: go test ./...
      - run: pip install -r bridge/requirements.txt
      - run: python -m compileall -q bridge
      - run: python -m unittest discover -s bridge/tests -v
        env:
          PYTHONPATH: bridge

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: cpa-subscription-bridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
