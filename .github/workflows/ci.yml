name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true
      - run: go test ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: cpa-copilot-cursor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test Cursor runtime
        run: |
          output="$(docker run --rm --entrypoint /opt/cursor-agent/node cpa-copilot-cursor:ci /opt/cursor-agent/index.js --list-models 2>&1 || true)"
          printf '%s\n' "$output"
          ! printf '%s\n' "$output" | grep -q 'cannot open shared object file'
